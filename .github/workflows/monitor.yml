name: Monitor
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check every minute
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          for i in $(seq 1 55); do
            python monitor.py || true
            python gymshark.py || true
            python gymshark_ca.py || true
            if [ $i -lt 55 ]; then sleep 60; fi
          done
      - name: Save state
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state*.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
