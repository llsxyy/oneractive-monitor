name: Monitor
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check every minute
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          END=$(( $(date +%s) + 56*60 ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            echo "== round $i =="
            START=$(date +%s)
            python monitor.py || true
            python gymshark.py || true
            python gymshark_ca.py || true
            python gymshark_au.py || true
            ELAPSED=$(( $(date +%s) - START ))
            REMAIN=$(( 60 - ELAPSED ))
            if [ "$REMAIN" -gt 0 ] && [ "$(date +%s)" -lt "$END" ]; then
              sleep "$REMAIN"
            fi
          done
          echo "共執行 $i 輪"
      - name: Save state
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state*.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
